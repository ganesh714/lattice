<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{cspSource}} 'unsafe-inline'; script-src 'nonce-{{nonce}}' {{cspSource}} https://cdn.jsdelivr.net; connect-src *; img-src *; font-src *;">
    <style nonce="{{nonce}}">{{inlineStyles}}</style>
    <script nonce="{{nonce}}">
        console.log('[Lattice Debug] HTML Script Executing');
        window.addEventListener('DOMContentLoaded', () => {
            console.log('[Lattice Debug] DOMContentLoaded');
        });
    </script>
    <script nonce="{{nonce}}" src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <title>Omrix Chat</title>
</head>
<body>
    <div id="chat-history">
        <div class="message bot-message">Hello! I am Omrix. How can I assist you today?</div>
    </div>
    
    <div id="input-wrapper">
        <div id="copilot-input-box">
            <textarea id="prompt-input" placeholder="Ask Omrix something..." rows="1"></textarea>
            
            <div id="input-toolbar">
                <div class="toolbar-left">
                    <button id="attach-button" class="icon-button" title="Attach context (future)">+</button>
                    <button id="settings-button" class="icon-button settings-button" title="Settings">⚙️</button>
                </div>
                <div class="toolbar-right">
                    <button id="send-button" class="icon-button send-button" title="Send message">
                        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
                            <path fill-rule="evenodd" clip-rule="evenodd" d="M8.354 1.146a.5.5 0 0 0-.708 0l-6 6a.5.5 0 0 0 .708.708L7.5 2.707V14.5a.5.5 0 0 0 1 0V2.707l5.146 5.147a.5.5 0 0 0 .708-.708l-6-6z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2>Lattice Settings</h2>
                <button class="modal-close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <!-- Gemini API Key -->
                <div class="settings-group">
                    <label for="gemini-api-input">Gemini API Key</label>
                    <input type="password" id="gemini-api-input" placeholder="Enter your Gemini API key" />
                    <button id="fetch-gemini-models-btn" class="fetch-btn">Fetch Models</button>
                </div>

                <!-- Groq API Key -->
                <div class="settings-group">
                    <label for="groq-api-input">Groq API Key</label>
                    <input type="password" id="groq-api-input" placeholder="Enter your Groq API key" />
                    <button id="fetch-groq-models-btn" class="fetch-btn">Fetch Models</button>
                </div>

                <!-- Ollama URL -->
                <div class="settings-group">
                    <label for="ollama-url-input">Ollama URL</label>
                    <input type="text" id="ollama-url-input" placeholder="http://localhost:11434" />
                    <button id="fetch-ollama-models-btn" class="fetch-btn">Fetch Models</button>
                </div>

                <!-- Ollama Models (dynamic list) -->
                <div class="settings-group">
                    <label for="ollama-models-list">Available Ollama Models</label>
                    <select id="ollama-models-list" size="4">
                        <option disabled>Loading... or enter Ollama URL above</option>
                    </select>
                </div>

                <!-- L1 Model Selection -->
                <div class="settings-group">
                    <label for="l1-model-select">L1 (Router) Model</label>
                    <select id="l1-model-select">
                        <option value="" disabled selected>Select a model...</option>
                    </select>
                </div>

                <!-- L2 Model Selection -->
                <div class="settings-group">
                    <label for="l2-model-select">L2 (Critic) Model</label>
                    <select id="l2-model-select">
                        <option value="" disabled selected>Select a model...</option>
                    </select>
                </div>

                <div class="settings-divider"></div>

                <!-- MCP Section -->
                <div class="mcp-section">
                    <h3>🔌 MCP Servers</h3>
                    
                    <div id="mcp-servers-list">
                        <p class="loading">Loading server connection status...</p>
                    </div>
                    
                    <div class="add-mcp-form">
                        <h4>Add New Server</h4>
                        
                        <div class="settings-group">
                            <label for="mcp-preset-select">Preset Server</label>
                            <select id="mcp-preset-select">
                                <option value="postgres">🐘 PostgreSQL (Community)</option>
                                <option value="github">🐙 GitHub (Community)</option>
                                <option value="sqlite">💾 SQLite (Community)</option>
                                <option value="custom" selected>⚙️ Custom Configuration</option>
                            </select>
                        </div>

                        <div class="settings-group">
                            <label for="mcp-name-input">Server Name</label>
                            <input type="text" id="mcp-name-input" placeholder="e.g. postgres-db" />
                        </div>

                        <div class="settings-group" id="mcp-command-group">
                            <label for="mcp-command-input">Command</label>
                            <input type="text" id="mcp-command-input" placeholder="e.g. npx" />
                        </div>

                        <div class="settings-group" id="mcp-args-group">
                            <label for="mcp-args-input">Arguments (JSON array)</label>
                            <input type="text" id="mcp-args-input" placeholder='e.g. ["-y", "@modelcontextprotocol/server-postgres"]' />
                        </div>

                        <div class="settings-group" id="mcp-env-group">
                            <label for="mcp-env-input">Environment Variables (JSON object)</label>
                            <input type="text" id="mcp-env-input" placeholder='e.g. {"DB_USER": "postgres"}' />
                        </div>

                        <!-- Dynamic Preset Input Fields -->
                        <div class="settings-group hidden" id="mcp-preset-uri-group">
                            <label for="mcp-preset-uri-input">Connection URI / Path</label>
                            <input type="text" id="mcp-preset-uri-input" placeholder="e.g. postgresql://localhost/mydb" />
                        </div>

                        <div class="settings-group hidden" id="mcp-preset-token-group">
                            <label for="mcp-preset-token-input">Access Token</label>
                            <input type="password" id="mcp-preset-token-input" placeholder="Enter API Token" />
                        </div>

                        <button id="add-mcp-btn" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Add MCP Server</button>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="settings-save-btn" class="btn btn-primary">Save & Close</button>
                <button id="settings-cancel-btn" class="btn btn-secondary">Cancel</button>
            </div>
        </div>
    </div>

    <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
</body>
</html>
